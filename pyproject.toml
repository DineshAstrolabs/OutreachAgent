[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach-agent"
version = "0.1.0"
description = "Post-Setup Company Qualification Agent for AstroLabs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pydantic>=2.6",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# Open-source captcha fallback. Also needs the `tesseract` system binary
# (brew install tesseract / apt-get install tesseract-ocr).
tesseract = [
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[project.scripts]
outreach-agent = "outreach_agent.cli:main"

[tool.setuptools]
# Explicit package list (no `find` directive) — keeps editable installs
# deterministic across setuptools/pip versions. `find` has historically
# written bad .pth files on some combos with src-layout, leading to
# "ModuleNotFoundError: No module named 'outreach_agent'" after install.
package-dir = {"" = "src"}
packages = [
    "outreach_agent",
    "outreach_agent.crm",
    "outreach_agent.sources",
]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
